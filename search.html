<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Library Search Results: "modern web"</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5b6475; --accent:#1b5e8c; --line:#d9dee7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem; }
  header { padding-top: 2rem; }
  h1 { margin:0 0 .25rem; font-size:2rem; }
  .summary { color:var(--muted); margin:0; }
  nav a { color:var(--accent); }
  .book { display:flex; gap:1.25rem; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:1rem; margin-bottom:1rem; }
  .cover { flex:0 0 120px; }
  .cover img { width:120px; height:auto; display:block; border:1px solid var(--line); }
  .no-cover { width:120px; height:170px; display:flex; align-items:center; justify-content:center; text-align:center; background:#eceff4; color:var(--muted); font-size:.85rem; padding:.5rem; border:1px solid var(--line); }
  .info { flex:1; min-width:0; }
  .info h2 { margin:0; font-size:1.3rem; }
  .subtitle { margin:.1rem 0 .5rem; color:var(--muted); font-style:italic; }
  dl { display:grid; grid-template-columns: 10rem 1fr; gap:.2rem .75rem; margin:.5rem 0; font-family: system-ui, sans-serif; font-size:.9rem; }
  dt { font-weight:600; color:var(--muted); }
  dd { margin:0; overflow-wrap:anywhere; }
  a { color:var(--accent); }
  a:focus-visible { outline:3px solid #f2a900; outline-offset:2px; }
  .na { color:var(--muted); font-style:italic; }
  @media (max-width:560px) { .book { flex-direction:column; } dl { grid-template-columns:1fr; } dt { margin-top:.4rem; } }
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<header>
  <nav aria-label="Breadcrumb"><a href="index.html">Project Home</a></nav>
  <h1>Open Library Search Results</h1>
  <p class="summary" id="summary">Loading results…</p>
</header>
<main id="results" aria-live="polite"></main>
<footer>
  <p>Data source: <a href="https://openlibrary.org/search?q=modern+web">Open Library search for "modern web"</a></p>
</footer>

<script>
$(function () {
  var NA = '<span class="na">Not available</span>';

  // Return escaped text, or "Not available" when the value is missing/empty.
  function text(v) {
    if (v === undefined || v === null || v === '' || ($.isArray(v) && v.length === 0)) return NA;
    return $('<div>').text($.isArray(v) ? v.join(', ') : v).html();
  }

  function row(label, html) { return '<dt>' + label + '</dt><dd>' + html + '</dd>'; }

  $.getJSON('openlibrary-search.json')
    .done(function (data) {
      var docs = data.docs || [];
      $('#summary').text('Search phrase "' + (data.q || 'modern web') + '": showing ' +
        docs.length + ' of ' + (data.numFound || docs.length) + ' matching books.');

      // Main loop over the docs array
      $.each(docs, function (i, book) {
        var title = book.title || 'Untitled';
        var workUrl = book.key ? 'https://openlibrary.org' + book.key : null;

        var cover = book.cover_i
          ? '<img src="https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg" alt="Cover of ' +
            $('<div>').text(title).html() + '">'
          : '<div class="no-cover">No cover available</div>';

        // Authors: loop through author_name and pair with author_key when present
        var authors = NA;
        if (book.author_name && book.author_name.length) {
          var parts = [];
          $.each(book.author_name, function (j, name) {
            var key = book.author_key && book.author_key[j];
            var safe = $('<div>').text(name).html();
            parts.push(key ? '<a href="https://openlibrary.org/authors/' + key + '">' + safe + '</a>' : safe);
          });
          authors = parts.join(', ');
        }

        var ebook = { borrowable: 'Borrowable', no_ebook: 'No ebook', public: 'Public', printdisabled: 'Print disabled' }[book.ebook_access];

        var html = '<article class="book"><div class="cover">' + cover + '</div><div class="info">' +
          '<h2>' + (workUrl ? '<a href="' + workUrl + '">' + $('<div>').text(title).html() + '</a>' : $('<div>').text(title).html()) + '</h2>' +
          (book.subtitle ? '<p class="subtitle">' + $('<div>').text(book.subtitle).html() + '</p>' : '') +
          '<dl>' +
          row('Author(s)', authors) +
          row('First published', text(book.first_publish_year)) +
          row('Editions', text(book.edition_count)) +
          row('Language', text(book.language)) +
          row('Full text', book.has_fulltext ? 'Yes' : 'No') +
          row('Ebook access', text(ebook || book.ebook_access)) +
          row('Cover edition', book.cover_edition_key
            ? '<a href="https://openlibrary.org/books/' + book.cover_edition_key + '">' + book.cover_edition_key + '</a>' : NA) +
          row('Internet Archive', book.ia && book.ia.length
            ? '<a href="https://archive.org/details/' + book.ia[0] + '">' + book.ia[0] + '</a>' : NA) +
          row('Collections', text(book.ia_collection)) +
          row('Open Library', workUrl ? '<a href="' + workUrl + '">View work record</a>' : NA) +
          '</dl></div></article>';

        $('#results').append(html);
      });

      if (!docs.length) $('#results').html('<p>No results found in the JSON file.</p>');
    })
    .fail(function () {
      $('#summary').text('Could not load openlibrary-search.json. Check that it is in the same folder as this page and that you are viewing the page through a web server.');
    });
});
</script>
</body>
</html>
