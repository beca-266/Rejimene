<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Library Book Edition</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5b6475; --accent:#1b5e8c; --line:#d9dee7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header, main, footer { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem; }
  header { padding-top: 2rem; }
  h1 { margin:0 0 .25rem; font-size:2rem; }
  h2 { font-size:1.2rem; margin:0 0 .5rem; }
  .muted { color:var(--muted); }
  .na { color:var(--muted); font-style:italic; }
  a { color:var(--accent); }
  a:focus-visible { outline:3px solid #f2a900; outline-offset:2px; }
  .top { display:flex; gap:1.5rem; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:1rem; margin-bottom:1rem; }
  .covers { flex:0 0 200px; }
  .covers img { width:200px; height:auto; display:block; border:1px solid var(--line); margin-bottom:.5rem; }
  .covers img.alt { width:100px; }
  .no-cover { width:200px; height:280px; display:flex; align-items:center; justify-content:center; background:#eceff4; color:var(--muted); border:1px solid var(--line); }
  .quote { font-style:italic; border-left:4px solid var(--accent); margin:.75rem 0; padding:.25rem .75rem; }
  section { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:1rem; margin-bottom:1rem; }
  dl { display:grid; grid-template-columns: 11rem 1fr; gap:.25rem .75rem; margin:0; font-family: system-ui, sans-serif; font-size:.92rem; }
  dt { font-weight:600; color:var(--muted); }
  dd { margin:0; overflow-wrap:anywhere; }
  ul { margin:0; padding-left:1.2rem; font-family: system-ui, sans-serif; font-size:.9rem; overflow-wrap:anywhere; }
  details summary { cursor:pointer; font-weight:600; }
  @media (max-width:600px) { .top { flex-direction:column; } dl { grid-template-columns:1fr; } dt { margin-top:.4rem; } }
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<header>
  <nav aria-label="Breadcrumb"><a href="index.html">Project Home</a></nav>
  <p class="muted" id="status">Loading book…</p>
</header>
<main id="book"></main>
<footer><p class="muted">Data source: Open Library edition record (openlibrary-book.json)</p></footer>

<script>
$(function () {
  var NA = '<span class="na">Not available</span>';
  var OL = 'https://openlibrary.org';

  function esc(v) { return $('<div>').text(v).html(); }
  function has(v) { return v !== undefined && v !== null && v !== '' && !($.isArray(v) && v.length === 0); }
  function row(label, html) { return '<dt>' + label + '</dt><dd>' + (html || NA) + '</dd>'; }
  function list(arr, fn) {            // loop over an array and join results
    if (!has(arr)) return '';
    var out = [];
    $.each(arr, function (i, item) { out.push(fn(item)); });
    return out.join(', ');
  }
  function lastPart(key) { return key ? key.split('/').pop() : ''; }

  $.getJSON('openlibrary-book.json')
    .done(function (b) {
      var title = b.title || 'Untitled';
      document.title = title + ' | Open Library Edition';
      $('#status').remove();

      // Covers: loop, skipping invalid ids such as -1
      var covers = [];
      $.each(b.covers || [], function (i, id) { if (id > 0) covers.push(id); });
      var coverHtml = '<div class="no-cover">No cover available</div>';
      if (covers.length) {
        coverHtml = '<img src="https://covers.openlibrary.org/b/id/' + covers[0] + '-L.jpg" alt="Front cover of ' + esc(title) + '">';
        $.each(covers.slice(1), function (i, id) {
          coverHtml += '<img class="alt" src="https://covers.openlibrary.org/b/id/' + id + '-M.jpg" alt="Alternate cover ' + (i + 2) + ' of ' + esc(title) + '">';
        });
      }

      var editionUrl = b.key ? OL + b.key : null;
      var workUrl = b.works && b.works[0] && b.works[0].key ? OL + b.works[0].key : null;
      var sentence = b.first_sentence && b.first_sentence.value;

      var authors = list(b.authors, function (a) {
        return a && a.key ? '<a href="' + OL + a.key + '">Author record ' + esc(lastPart(a.key)) + '</a>' : '';
      });
      var langs = list(b.languages, function (l) { return l && l.key ? esc(lastPart(l.key)) : ''; });
      var contrib = has(b.contributions) ? esc(b.contributions.join(', ')) : '';

      var ids = '';
      if (b.identifiers) {
        $.each(b.identifiers, function (name, values) {
          ids += (ids ? '; ' : '') + esc(name) + ': ' + esc(values.join(', '));
        });
      }

      var html = '<div class="top"><div class="covers">' + coverHtml + '</div><div>' +
        '<h1>' + esc(title) + '</h1>' +
        '<p class="muted">Contributors: ' + (contrib || NA) + '</p>' +
        (sentence ? '<p class="quote">First sentence: &ldquo;' + esc(sentence) + '&rdquo;</p>' : '<p class="muted">First sentence: ' + NA + '</p>') +
        '<p>' + (editionUrl ? '<a href="' + editionUrl + '">View edition on Open Library</a>' : NA) +
        (workUrl ? ' | <a href="' + workUrl + '">View work record</a>' : '') +
        (b.ocaid ? ' | <a href="https://archive.org/details/' + esc(b.ocaid) + '">Internet Archive copy</a>' : '') + '</p>' +
        '</div></div>';

      html += '<section><h2>Publication details</h2><dl>' +
        row('Author(s)', authors) +
        row('Publisher(s)', has(b.publishers) ? esc(b.publishers.join(', ')) : '') +
        row('Publication date', has(b.publish_date) ? esc(b.publish_date) : '') +
        row('Pages', has(b.number_of_pages) ? esc(b.number_of_pages) : '') +
        row('Language(s)', langs) +
        row('ISBN-10', has(b.isbn_10) ? esc(b.isbn_10.join(', ')) : '') +
        row('ISBN-13', has(b.isbn_13) ? esc(b.isbn_13.join(', ')) : '') +
        row('Other identifiers', ids) +
        row('Edition key', has(b.key) ? esc(lastPart(b.key)) : '') +
        row('Record created', b.created ? esc(b.created.value.substring(0, 10)) : '') +
        row('Last modified', b.last_modified ? esc(b.last_modified.value.substring(0, 10)) : '') +
        row('Revision', has(b.revision) ? esc(b.revision) : '') +
        '</dl></section>';

      if (has(b.source_records)) {
        html += '<section><details><summary>Source records (' + b.source_records.length + ')</summary><ul>';
        $.each(b.source_records, function (i, s) { html += '<li>' + esc(s) + '</li>'; });
        html += '</ul></details></section>';
      }
      if (has(b.local_id)) {
        html += '<section><details><summary>Local library identifiers (' + b.local_id.length + ')</summary><ul>';
        $.each(b.local_id, function (i, s) { html += '<li>' + esc(s) + '</li>'; });
        html += '</ul></details></section>';
      }

      $('#book').html(html);
    })
    .fail(function () {
      $('#status').text('Could not load openlibrary-book.json. Check that it is in the same folder and that the page is served from a web server.');
    });
});
</script>
</body>
</html>
