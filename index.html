<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Search | Open Library</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<header>
  <nav aria-label="Main">
    <ul>
      <li><a href="index.html" aria-current="page">Home</a></li>
      <li><a href="bookshelf.html">My Bookshelf</a></li>
    </ul>
  </nav>
  <h1>Book Search</h1>
  <form class="search" id="searchForm">
    <input type="search" id="term" placeholder="Search by title, author, or topic" aria-label="Search terms">
    <button type="submit">Search</button>
  </form>
  <div id="status" aria-live="polite"></div>
</header>
<main>
  <div id="results"></div>
  <div class="pager" id="pager" hidden>
    <label for="pageSelect">Page</label>
    <select id="pageSelect"></select>
    <span id="pageInfo" class="muted"></span>
  </div>
</main>
<footer><p class="muted">Data source: <a href="https://openlibrary.org">Open Library</a></p></footer>
<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
